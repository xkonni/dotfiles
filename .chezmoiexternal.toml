    refreshPeriod = "168h"
["{{ $fontDir }}/CaskaydiaCove Regular.ttf"]
    type = "file"
    url = "https://github.com/eliheuer/caskaydia-cove/raw/refs/heads/master/fonts/ttf/CaskaydiaCove-Regular.ttf"
