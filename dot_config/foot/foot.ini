# vim: ft=config

# shell=$SHELL (if set, otherwise user's default shell from /etc/passwd)
# term=foot (or xterm-256color if built with -Dterminfo=disabled)
# term=xterm-256color
# login-shell=no

## 👾 CaskaydiaCove Nerd Font Mono
# font=CaskaydiaCove Nerd Font Mono:style=Regular:size=11
# font-bold=CaskaydiaCove Nerd Font Mono:style=Bold:size=11
# font-italic=CaskaydiaCove Nerd Font Mono:style=Italic:size=11
# font-bold-italic=CaskaydiaCove Nerd Font Mono:style=Bold Italic:size=11

## 👾 MesloLGM Nerd Font Mono
font=MesloLGM Nerd Font Mono:style=Regular:size=11
font-bold=MesloLGM Nerd Font Mono:style=Bold:size=11
font-italic=MesloLGM Nerd Font Mono:style=Italic:size=11
font-bold-italic=MesloLGM Nerd Font Mono:style=Bold Italic:size=11

##
# line-height=<font metrics>
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# box-drawings-uses-font-glyphs=no
dpi-aware=no

# initial-window-size-pixels=700x500  # Or,
# initial-window-size-chars=<COLSxROWS>
initial-window-size-chars=120x30
# initial-window-mode=windowed
# pad=2x2                             # optionally append 'center'
# resize-delay-ms=8.50

# bold-text-in-bright=no
# bell=none
# word-delimiters=,│`|:"'()[]{}<>
# jump-label-letters=sadfjklewcmpgh
# selection-target=primary
# workers=<number of logical CPUs>
# osc8-underline=url-mode

[url]
launch=xdg-open ${url}

[scrollback]
lines=10000
# multiplier=3.0
# indicator-position=relative
# indicator-format=

[cursor]
# style=block
# color=111111 dcdccc
# blink=no

[desktop-notifications]
command=notify-send -a foot -i foot ${title} ${body}

[mouse]
# hide-when-typing=no
# alternate-scroll-mode=yes

[colors-dark]
alpha=0.85
foreground=dcdccc
background=111111
regular0=073642  # black
regular1=dc322f  # red
regular2=859900  # green
regular3=b58900  # yellow
regular4=268bd2  # blue
regular5=d33682  # magenta
regular6=00afff  # cyan
regular7=eee8d5  # white
bright0=002b36   # bright black
bright1=cb4b16   # bright red
bright2=b3cd01   # bright green
bright3=f4c32f   # bright yellow
bright4=30a6f8   # bright blue
bright5=6c71c4   # bright magenta
bright6=69b3ad   # bright cyan
bright7=fdf6e3   # bright white
# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
# jump-labels=<regular0> <regular3>
# urls=<regular3>

