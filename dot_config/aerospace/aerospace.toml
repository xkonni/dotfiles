# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = false

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 6
    inner.vertical =   6
    outer.left =       6
    outer.bottom =     6
    outer.top =        6
    outer.right =      6

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''
    # alt-enter = 'exec-and-forget open -n -a iTerm'
    alt-enter = '''exec-and-forget osascript -e '
    tell application "iTerm"
        create window with profile "Default"
    end tell'
    '''
    # alt-enter = 'exec-and-forget kitty'
    # alt-r = 'exec-and-forget open -n -a raycast'

    # quit application
    alt-shift-q = 'close --quit-if-last-window'
    # alt-space = 'exec-and-forget open -n -a iTerm -e clipse'

    # fullscreen
    alt-f = 'fullscreen --no-outer-gaps'

    # disable 'hide application' shortcut
    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-e = 'layout tiles horizontal vertical'
    alt-w = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus --boundaries all-monitors-outer-frame left'
    alt-j = 'focus --boundaries all-monitors-outer-frame down'
    alt-k = 'focus --boundaries all-monitors-outer-frame up'
    alt-l = 'focus --boundaries all-monitors-outer-frame right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
    alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
    alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
    alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

    alt-ctrl-shift-h = 'join-with left'
    alt-ctrl-shift-j = 'join-with down'
    alt-ctrl-shift-k = 'join-with up'
    alt-ctrl-shift-l = 'join-with right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-ctrl-h = 'resize smart -50'
    alt-ctrl-l = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-space = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout

    # scratchpad
    # a
    alt-shift-a = [ 'exec-and-forget aerospace-marks mark a',
                    'exec-and-forget osascript -e "display notification \"mark a\" with title \"aerospace\""' ]
    alt-ctrl-a = [ 'exec-and-forget aerospace-marks unmark a',
                   'exec-and-forget osascript -e "display notification \"unmark a\" with title \"aerospace\""' ]
    alt-a = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get a -a)\" -F window-id=\"$(aerospace-marks get a -i)\""]
    # s - DO NOT USE, breaks sz
    # alt-shift-s = [ 'exec-and-forget aerospace-marks mark s',
    #                 'exec-and-forget osascript -e "display notification \"mark s\" with title \"aerospace\""' ]
    # alt-ctrl-s = [ 'exec-and-forget aerospace-marks unmark s',
    #                'exec-and-forget osascript -e "display notification \"unmark s\" with title \"aerospace\""' ]
    # alt-s = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get s -a)\" -F window-id=\"$(aerospace-marks get s -i)\""]
    # d
    alt-shift-d = [ 'exec-and-forget aerospace-marks mark d',
                    'exec-and-forget osascript -e "display notification \"mark d\" with title \"aerospace\""' ]
    alt-ctrl-d = [ 'exec-and-forget aerospace-marks unmark d',
                   'exec-and-forget osascript -e "display notification \"unmark d\" with title \"aerospace\""' ]
    alt-d = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get d -a)\" -F window-id=\"$(aerospace-marks get d -i)\""]
    # z
    alt-shift-z = [ 'exec-and-forget aerospace-marks mark z',
                    'exec-and-forget osascript -e "display notification \"mark z\" with title \"aerospace\""' ]
    alt-ctrl-z = [ 'exec-and-forget aerospace-marks unmark z',
                    'exec-and-forget osascript -e "display notification \"unmark z\" with title \"aerospace\""' ]
    alt-z = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get z -a)\" -F window-id=\"$(aerospace-marks get z -i)\""]
    # x
    alt-shift-x = [ 'exec-and-forget aerospace-marks mark x',
                    'exec-and-forget osascript -e "display notification \"mark x\" with title \"aerospace\""' ]
    alt-ctrl-x = [ 'exec-and-forget aerospace-marks unmark x',
                    'exec-and-forget osascript -e "display notification \"unmark x\" with title \"aerospace\""' ]
    alt-x = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get x -a)\" -F window-id=\"$(aerospace-marks get x -i)\""]
    # c
    alt-shift-c = [ 'exec-and-forget aerospace-marks mark c',
                    'exec-and-forget osascript -e "display notification \"mark c\" with title \"aerospace\""' ]
    alt-ctrl-c = [ 'exec-and-forget aerospace-marks unmark c',
                    'exec-and-forget osascript -e "display notification \"unmark c\" with title \"aerospace\""' ]
    alt-c = [ 'focus-monitor DELL C3422WE', 'focus-monitor PG49WCD', "exec-and-forget aerospace-scratchpad show \"$(aerospace-marks get c -a)\" -F window-id=\"$(aerospace-marks get c -i)\""]


    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-n = [ 'exec-and-forget osascript -e "display notification \"mode service\" with title \"aerospace\""',
                    'mode service']
    alt-shift-m = [ 'exec-and-forget osascript -e "display notification \"mode moveresize\" with title \"aerospace\""',
                    'mode moveresize' ]


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = [ 'exec-and-forget osascript -e "display notification \"mode main\" with title \"aerospace\""',
            'mode main' ]
    r = [ 'exec-and-forget osascript -e "display notification \"reload config, mode main\" with title \"aerospace\""',
          'reload-config', 'mode main' ]
    f = ['flatten-workspace-tree', 'mode main'] # reset layout
    g = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    # backspace = ['close-all-windows-but-current', 'mode main']
    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

[mode.moveresize.binding]
    esc = [ 'exec-and-forget osascript -e "display notification \"mode main\" with title \"aerospace\""',
            'mode main' ]
    tab = 'focus --boundaries-action wrap-around-the-workspace right'
    h = 'exec-and-forget open -g "rectangle://execute-action?name=smaller-width"'
    j = 'exec-and-forget open -g "rectangle://execute-action?name=smaller-height"'
    k = 'exec-and-forget open -g "rectangle://execute-action?name=larger-height"'
    l = 'exec-and-forget open -g "rectangle://execute-action?name=larger-width"'
    q = 'exec-and-forget open -g "rectangle://execute-action?name=top-left-sixth"'
    w = 'exec-and-forget open -g "rectangle://execute-action?name=top-center-sixth"'
    e = 'exec-and-forget open -g "rectangle://execute-action?name=top-right-sixth"'
    a = 'exec-and-forget open -g "rectangle://execute-action?name=first-third"'
    s = 'exec-and-forget open -g "rectangle://execute-action?name=center"'
    d = 'exec-and-forget open -g "rectangle://execute-action?name=last-third"'
    z = 'exec-and-forget open -g "rectangle://execute-action?name=bottom-left-sixth"'
    x = 'exec-and-forget open -g "rectangle://execute-action?name=bottom-center-sixth"'
    c = 'exec-and-forget open -g "rectangle://execute-action?name=bottom-right-sixth"'

[workspace-to-monitor-force-assignment]
    1 = ['PG49WCD','DELL P2723DE',  'DELL C3422WE', 'Built-in Retina Display']
    2 = ['PG49WCD','DELL P2723DE',  'DELL C3422WE', 'Built-in Retina Display']
    3 = ['PG49WCD','DELL P2723DE',  'DELL C3422WE', 'Built-in Retina Display']
    4 = ['DELL P2723DE', 'PG49WCD', 'Built-in Retina Display', 'DELL C3422WE']
    5 = ['DELL P2723DE', 'PG49WCD', 'Built-in Retina Display', 'DELL C3422WE']
    6 = ['DELL P2723DE', 'PG49WCD', 'Built-in Retina Display', 'DELL C3422WE']
    7 = ['Built-in Retina Display']
    8 = ['Built-in Retina Display']
    9 = ['Built-in Retina Display']
    ".scratchpad" = ['PG49WCD', 'DELL C3422WE', 'Built-in Retina Display']

